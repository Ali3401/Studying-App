name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Self test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the parser and clean-up tests
        run: node tools/selftest.mjs
      - name: Check every module parses
        run: |
          set -e
          for f in $(find src tools sw.js -name '*.js' -o -name '*.mjs' | grep -v vendor); do
            node --check "$f"
          done

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The workflow token is not allowed to create the Pages site, so if it
      # has never been switched on, say so in a way that is hard to misread
      # rather than failing with "Get Pages site failed".
      - name: Check that Pages is switched on
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "404" ]; then
            echo "::error title=GitHub Pages has not been switched on::Open Settings then Pages, set Source to 'GitHub Actions', and re-run this workflow. That is the only manual step; everything else deploys itself. The tests above already passed."
            exit 1
          fi
          echo "Pages is enabled (HTTP $code)."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
